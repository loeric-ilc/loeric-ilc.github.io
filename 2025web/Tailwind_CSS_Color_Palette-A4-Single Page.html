<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailwind CSS Professional Palette (Single Page A4)</title>

<style>
/* A4 橫式與邊距設定 */
@page {
    size: A4 landscape;
    margin: 6mm; /* 稍微縮小邊距以確保絕對能塞入單頁 */
}

body {
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    margin: 0;
    padding: 15px;
    background: #f5f5f5;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
}

.container {
    max-width: 100%; /* 放寬限制讓表格自然延伸 */
    margin: auto;
}

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}

button {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-size: 13px;
}

button:hover {
    opacity: .9;
}

.sheet {
    background: white;
    padding: 8px 12px;
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h1 {
    margin: 0 0 8px;
    font-size: 12px; /* 縮小標題節省高度 */
    color: #334155;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed; /* 均分 11 欄寬度 */
}

th {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 3px;
    font-size: 10px;
    color: #64748b;
}

td {
    border: 1px solid #e2e8f0;
    padding: 1.5px; /* 極致壓縮間距 */
}

.swatch {
    height: 28.8px; /* 關鍵：縮小高度以確保 22 列不超過 A4 高度 */
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    line-height: 1.1;
    font-family: Consolas, monospace;
}

.css-name {
    font-size: 8.5px;
    font-weight: bold;
    letter-spacing: -0.2px;
}

.hex {
    font-size: 7.5px;
    opacity: 0.9;
}

@media print {
    body {
        background: white;
        padding: 0;
    }
    .toolbar {
        display: none;
    }
    .sheet {
        box-shadow: none;
        border: none;
        padding: 0;
    }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>
<body>

<div class="container">

<div class="toolbar">
    <button onclick="window.print()">列印 (請選橫向)</button>
    <button onclick="exportPDF()">匯出 PDF</button>
</div>

<div class="sheet" id="sheet">

<h1>Tailwind CSS Color Palette (A4 Single Page)</h1>

<table id="paletteTable">
    <tbody></tbody>
</table>

</div>

</div>

<script>
const steps = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];

const colorHexMap = {
    slate: ["#f8fafc","#f1f5f9","#e2e8f0","#cbd5e1","#94a3b8","#64748b","#475569","#334155","#1e293b","#0f172a","#020617"],
    gray: ["#f9fafb","#f3f4f6","#e5e7eb","#d1d5db","#9ca3af","#6b7280","#4b5563","#374151","#1f2937","#111827","#030712"],
    zinc: ["#fafafa","#f4f4f5","#e4e4e7","#d4d4d8","#a1a1aa","#71717a","#52525b","#3f3f46","#27272a","#18181b","#09090b"],
    neutral: ["#fafafa","#f5f5f5","#e5e5e5","#d4d4d4","#a3a3a3","#737373","#525252","#404040","#262626","#171717","#0a0a0a"],
    stone: ["#fafaf9","#f5f5f4","#e7e5e4","#d6d3d1","#a8a29e","#78716c","#57534e","#44403c","#292524","#1c1917","#0c0a09"],
    red: ["#fef2f2","#fee2e2","#fecaca","#fca5a5","#f87171","#ef4444","#dc2626","#b91c1c","#991b1b","#7f1d1d","#450a0a"],
    orange: ["#fff7ed","#ffedd5","#fed7aa","#fdba74","#fb923c","#f97316","#ea580c","#c2410c","#9a3412","#7c2d12","#431407"],
    amber: ["#fffbeb","#fef3c7","#fde68a","#fcd34d","#fbbf24","#f59e0b","#d97706","#b45309","#854d0e","#78350f","#451a03"],
    yellow: ["#fefce8","#fef9c3","#fef08a","#fde047","#facc15","#eab308","#ca8a04","#a16207","#854d0e","#713f12","#422006"],
    lime: ["#f7fee7","#ecfccb","#d9f99d","#bef264","#a3e635","#84cc16","#65a30d","#4d7c0f","#3f6212","#274011","#1a2e05"],
    green: ["#f0fdf4","#dcfce7","#bbf7d0","#86efac","#4ade80","#22c55e","#16a34a","#15803d","#166534","#14532d","#052e16"],
    emerald: ["#ecfdf5","#d1fae5","#a7f3d0","#6ee7b7","#34d399","#10b981","#059669","#047857","#065f46","#064e3b","#022c22"],
    teal: ["#f0fdfa","#ccfbf1","#99f6e4","#5eead4","#2dd4bf","#14b8a6","#0d9488","#0f766e","#115e59","#134e4a","#042f2e"],
    cyan: ["#ecfeff","#cffafe","#a5f3fc","#67e8f9","#22d3ee","#06b6d4","#0891b2","#0e7490","#155e75","#164e63","#083344"],
    sky: ["#f0f9ff","#e0f2fe","#bae6fd","#7dd3fc","#38bdf8","#0ea5e9","#0284c7","#0369a1","#075985","#0c4a6e","#082f49"],
    blue: ["#eff6ff","#dbeafe","#bfdbfe","#93c5fd","#60a5fa","#3b82f6","#2563eb","#1d4ed8","#1e40af","#1e3a8a","#172554"],
    indigo: ["#eef2ff","#e0e7ff","#c7d2fe","#a5b4fc","#818cf8","#6366f1","#4f46e5","#4338ca","#3730a3","#312e81","#1e1b4b"],
    violet: ["#f5f3ff","#ede9fe","#ddd6fe","#c4b5fd","#a78bfa","#8b5cf6","#7c3aed","#6d28d9","#5b21b6","#4c1d95","#2e1065"],
    purple: ["#faf5ff","#f3e8ff","#e9d5ff","#d8b4fe","#c084fc","#a855f7","#9333ea","#7e22ce","#6b21a8","#581c87","#3b0764"],
    fuchsia: ["#fdf4ff","#fae8ff","#f5d0fe","#f0abfc","#e879f9","#d946ef","#c026d3","#a21caf","#86198f","#701a75","#4a044e"],
    pink: ["#fdf2f8","#fce7f3","#fbcfe8","#f9a8d4","#f472b6","#ec4899","#db2777","#be185d","#9d174d","#831843","#500724"],
    rose: ["#fff1f2","#ffe4e6","#fecdd3","#fda4af","#fb7185","#f43f5e","#e11d48","#be123c","#9f1239","#881337","#4c0519"]
};

// 亮度計算，決定文字用黑字還是白字
function textColor(hex) {
    const r = parseInt(hex.substr(1,2), 16);
    const g = parseInt(hex.substr(3,2), 16);
    const b = parseInt(hex.substr(5,2), 16);
    const lum = (0.299*r) + (0.587*g) + (0.114*b);
    return lum > 140 ? "rgba(0,0,0,0.8)" : "rgba(255,255,255,0.95)";
}

const tbody = document.querySelector("#paletteTable tbody");

Object.entries(colorHexMap).forEach(([name, colors]) => {
    let tr = document.createElement("tr");

    // 迴圈直接渲染 11 個色塊，無額外標題列
    colors.forEach((hex, index) => {
        const step = steps[index];
        tr.innerHTML += `
        <td>
            <div class="swatch" style="background:${hex}; color:${textColor(hex)};">
                <div class="css-name">${name}-${step}</div>
                <div class="hex">${hex}</div>
            </div>
        </td>`;
    });

    tbody.appendChild(tr);
});

// PDF 匯出函式
function exportPDF() {
    html2pdf()
    .set({
        filename: "tailwind-palette.pdf",
        margin: [5, 5, 5, 5],
        html2canvas: { scale: 3 },
        jsPDF: { unit: "mm", format: "a4", orientation: "landscape" }
    })
    .from(document.getElementById("sheet"))
    .save();
}
</script>

</body>
</html>
